[project]
name = "learning-assistant-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.3",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "passlib[bcrypt]>=1.7.4",
  "psycopg[binary]>=3.2.1",
  "pymysql>=1.1.1",
  "pydantic-settings>=2.5.2",
  "python-multipart>=0.0.9",
  "reportlab>=4.0",
  "sqlalchemy>=2.0.35",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6"
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# 起步只开"低争议"规则：pycodestyle 错误、pyflakes、import 排序、bugbear、pyupgrade
select = ["E", "F", "I", "B", "UP"]
ignore = [
  # FastAPI 的 Depends(...) 就是"在默认参数里调用函数"，属于误报
  "B008",
  # 行宽需要整体格式化，留到单独一轮用 ruff format 处理，避免一次改动淹没历史
  "E501",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]
