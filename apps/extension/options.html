<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Learning Assistant 配置</title>
    <style>
      body { margin: 0; padding: 24px; font: 14px/1.5 Arial, sans-serif; color: #16202a; background: #f5f7fb; }
      main { max-width: 720px; margin: 0 auto; background: white; border: 1px solid #d8e0ea; border-radius: 8px; padding: 20px; }
      label { display: block; margin: 14px 0; font-weight: 600; }
      input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 9px 10px; border: 1px solid #bdc9d8; border-radius: 6px; }
      .adapter-option { font-weight: 400; margin: 8px 0; }
      button { margin-right: 10px; padding: 8px 12px; border: 0; border-radius: 6px; color: white; background: #1267d8; cursor: pointer; }
      #status { min-height: 20px; color: #2d5d36; }
    </style>
  </head>
  <body>
    <main>
      <h1>Learning Assistant 插件配置</h1>
      <form id="optionsForm">
        <label>API 地址<input id="apiBaseUrl" type="text" /></label>
        <label>插件 Token<input id="apiToken" type="password" /></label>
        <section>
          <h2>启用的网站 adapter</h2>
          <div id="adapterList"></div>
        </section>
        <button type="submit">保存配置</button>
        <button id="testConnection" type="button">测试连接</button>
      </form>
      <p id="status"></p>
    </main>
    <script type="module" src="dist/options.js"></script>
  </body>
</html>
