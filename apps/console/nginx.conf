# 控制台容器：静态文件 + 同源反代 API
#
# 前端构建时 VITE_API_BASE_URL=/api/v1，所以浏览器请求的是同源 /api/v1/*,
# 由这里转发到 api 容器，避免跨域与"写死 127.0.0.1"的问题。

upstream learn_assistant_api {
    server api:17890;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 导入包上限 200MB，留一点余量；超时给大文件上传与后台导出留时间
    client_max_body_size 210m;

    location /api/ {
        proxy_pass http://learn_assistant_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 打包产物带 hash，可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA：控制台用 hash 路由，但刷新任意路径都要回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
