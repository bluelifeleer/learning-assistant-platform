# 单机部署：postgres + api + web（静态站点 + /api 反代）
#
# 用法：
#   cp .env.production.example .env.production   # 改掉密码与 pepper
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#   open http://localhost:8080
#
# 本地开发不要用这个文件：开发仍然走 scripts/dev.cmd（uvicorn + vite，端口 17890/17891）。

name: learn-assistant

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learn_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-learn_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 里设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learn_assistant} -d ${POSTGRES_DB:-learn_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      # 容器内必须用服务名连库，覆盖 .env.production 里的本机地址
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-learn_assistant}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-learn_assistant}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - exports:/data/exports
      - screenshots:/data/screenshots
      - note_images:/data/note_images
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

volumes:
  pgdata:
  exports:
  screenshots:
  note_images:

networks:
  backend:
